name: Auto-Sync Fork

on:
  schedule:
    # Runs every day at midnight UTC. Adjust if you want it more frequently (e.g., '0 */6 * * *' for every 6 hours)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually click "Run workflow" inside the Actions tab anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: en-translation

      - name: Run Upstream Sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_sync_repo: YuriRestia/Stronghold-Protocol-EN-translation
          upstream_sync_branch: en-translation
          target_sync_branch: en-translation
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
